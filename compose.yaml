# Self-hosted web service (spec §7.2). Caddy runs on the host and proxies to 127.0.0.1:${SERVER_PORT}.
#   docker compose up -d --build
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The password sits in a URL, so it must be URL-safe: openssl rand -hex 24
      DATABASE_URL: postgres://overdrive:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/overdrive
      # name:token,name:token (ADR 0014); empty means the API answers 401 to everyone.
      DEVICE_TOKENS: ${DEVICE_TOKENS:-}
      # intervals.icu (ADR 0016): off while the key is empty. Empty values mean the defaults.
      INTERVALS_API_KEY: ${INTERVALS_API_KEY:-}
      INTERVALS_ATHLETE_ID: ${INTERVALS_ATHLETE_ID:-}
      INTERVALS_BASE_URL: ${INTERVALS_BASE_URL:-}
      PLAN_REFRESH_MINUTES: ${PLAN_REFRESH_MINUTES:-}
      # The rider's time zone (IANA name): which day is "today" for the plan and for a ride.
      TIMEZONE: ${TIMEZONE:-}
      # Wellness and recovery (ADR 0023): empty values mean the defaults. docs/deploy.md, section 16.
      WELLNESS_SOURCE_ORDER: ${WELLNESS_SOURCE_ORDER:-}
      WELLNESS_PULL_HOURS: ${WELLNESS_PULL_HOURS:-}
      WELLNESS_BASELINE_DAYS: ${WELLNESS_BASELINE_DAYS:-}
      WELLNESS_NIGHTS_NEEDED: ${WELLNESS_NIGHTS_NEEDED:-}
      # Written insights, alerts and the language-model endpoint (ADR 0025): without LLM_BASE_URL and LLM_MODEL the notes are written
      # from templates and no health data leaves the server. Empty values mean the defaults. docs/deploy.md, section 17.
      INSIGHTS_ENABLED: ${INSIGHTS_ENABLED:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-}
      INSIGHTS_LANGUAGE: ${INSIGHTS_LANGUAGE:-}
      INSIGHT_MORNING_TIME: ${INSIGHT_MORNING_TIME:-}
      INSIGHT_DENY_WORDS: ${INSIGHT_DENY_WORDS:-}
      ALERT_STREAK_DAYS: ${ALERT_STREAK_DAYS:-}
      ALERT_MISSED_SESSIONS: ${ALERT_MISSED_SESSIONS:-}
      ALERT_LOAD_ABOVE_PERCENT: ${ALERT_LOAD_ABOVE_PERCENT:-}
      ALERT_LOAD_BELOW_PERCENT: ${ALERT_LOAD_BELOW_PERCENT:-}
      # The coach notebook's caps and the plan events' day end (ADR 0035): empty values mean the defaults. docs/deploy.md, section 19.
      NOTEBOOK_MAX_CHARS: ${NOTEBOOK_MAX_CHARS:-}
      NOTEBOOK_LOG_MAX_CHARS: ${NOTEBOOK_LOG_MAX_CHARS:-}
      PLAN_EVENT_DAY_END_GRACE_MINUTES: ${PLAN_EVENT_DAY_END_GRACE_MINUTES:-}
      # The MCP server and its OAuth server (ADR 0018): on only when both of the first two are set.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      OWNER_PASSPHRASE_HASH: ${OWNER_PASSPHRASE_HASH:-}
      MCP_STATIC_TOKENS: ${MCP_STATIC_TOKENS:-}
      # Google Calendar (ADR 0019): on only when all four are set. docs/deploy.md, section 14.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GCAL_WORKOUT_START: ${GCAL_WORKOUT_START:-}
      # Telegram bot (ADR 0019): off while the token is empty. docs/deploy.md, section 13.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:-}
      REMINDER_EVENING_TIME: ${REMINDER_EVENING_TIME:-}
      REMINDER_LEAD_MINUTES: ${REMINDER_LEAD_MINUTES:-}
      WEEKLY_SUMMARY_DAY: ${WEEKLY_SUMMARY_DAY:-}
      WEEKLY_SUMMARY_TIME: ${WEEKLY_SUMMARY_TIME:-}
      # The Strava upload (ADR 0020): on only when the first three are all set; STRAVA_BACKFILL defaults to false.
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REFRESH_TOKEN: ${STRAVA_REFRESH_TOKEN:-}
      STRAVA_BACKFILL: ${STRAVA_BACKFILL:-}
      STRAVA_BASE_URL: ${STRAVA_BASE_URL:-}
      # BRouter road routing (spec §11.4): empty means routing is off. Set to http://brouter:17777. docs/deploy.md, section 20.
      BROUTER_URL: ${BROUTER_URL:-}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"

  # BRouter routing server (spec §11.4), built from deploy/brouter. The tiles are not in the repository:
  # fetch them into ./data/brouter/segments4 first (docs/deploy.md, section 20). Nothing is published on the host;
  # the server reaches it at http://brouter:17777 on the compose network.
  brouter:
    build: deploy/brouter
    restart: unless-stopped
    mem_limit: 640m
    volumes:
      - ./data/brouter/segments4:/segments4:ro

  # PostgreSQL is the store (spec §7.2, ADR 0014): the server migrates it on start.
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: overdrive
      POSTGRES_DB: overdrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overdrive"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
