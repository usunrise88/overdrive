# Self-hosted web service (spec §7.2). Caddy runs on the host and proxies to 127.0.0.1:${SERVER_PORT}.
#   docker compose up -d --build
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"

  # PostgreSQL is the chosen store (spec §7.2). The server does not connect to it until Phase 2.
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: overdrive
      POSTGRES_DB: overdrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overdrive"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
