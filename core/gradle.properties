org.gradle.jvmargs=-Xmx4g
kotlin.daemon.jvmargs=-Xmx4g
kotlin.native.jvmArgs=-Xmx4g
kotlin.native.ignoreDisabledTargets=true
# Avoid pulling precompiled Kotlin/Native platform caches that reference newer Xcode SDK symbols
# missing on Xcode 16.4 / macOS 15 runners.
kotlin.native.cacheKind.macosArm64=none

