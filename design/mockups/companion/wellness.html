<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Companion: Wellness</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="companion.css">
</head>
<body data-ready="false">

<figure class="shot"><figcaption><b>Wellness · 4 weeks.</b> Full scroll. Small multiples on one time axis; the band is the usual range on each day; today is the large dot; days outside the band get a small dot. One night without data leaves a gap.</figcaption><div class="frame phone tall" id="wellness"></div></figure>
<figure class="shot"><figcaption><b>Wellness · a past day selected, partial data.</b> Holding on any chart selects that day in every chart; the values in each header follow and a "Showing" line names the day. No oxygen readings: the card says so instead of drawing an empty chart.</figcaption><div class="frame phone tall" id="wellness-selected"></div></figure>

<script type="module">
import { clock, dayOf, fmtDay, fmtShort, head, hm, ic, lineChart, range, readout, rng, shell, sleepTiming } from "./companion.js";

const W = 346;
const N = 28;
const T1 = "var(--color-text-primary)";
const T2 = "var(--color-text-secondary)";
const xTicks = [
  { i: 0, text: fmtShort(dayOf(N - 1)), anchor: "start" },
  { i: 13, text: fmtShort(dayOf(N - 14)) },
  { i: N - 1, text: "Today", anchor: "end" },
];
const series = (seed, base, spread, round = 0) => {
  const r = rng(seed);
  return Array.from({ length: N }, () => {
    const v = base + (r() - 0.5) * spread;
    return round ? Math.round(v * 10) / 10 : Math.round(v);
  });
};
const drift = (lo, hi, k = 0.02) => ({
  lo: Array.from({ length: N }, (_, i) => lo + Math.sin(i / 9) * k * (hi - lo)),
  hi: Array.from({ length: N }, (_, i) => hi + Math.sin(i / 9) * k * (hi - lo)),
});

const MISSING = N - 1 - 10; // the watch was charging that night

const build = (scenario) => {
  const caution = scenario === "caution";
  const rhr = series(3, 53, 5);
  if (caution) {
    rhr[N - 2] = 58;
    rhr[N - 1] = 59;
  } else rhr[N - 1] = 52;
  const sleep = series(8, 7.3, 1.3, 1);
  sleep[N - 1] = caution ? 7.08 : 7.67;
  const resp = series(12, 14.1, 0.9, 1);
  resp[N - 1] = caution ? 14.5 : 14.2;
  const spo2 = caution ? Array(N).fill(null) : series(4, 96.5, 2.4);
  if (!caution) spo2[N - 1] = 96;
  const rt = rng(31);
  const nights = Array.from({ length: N }, () => {
    const bed = 23 * 60 + 15 + (rt() - 0.5) * 70;
    return { bed, wake: bed + 7.3 * 60 + (rt() - 0.5) * 70 };
  });
  for (const s of [rhr, sleep, resp, spo2]) s[MISSING] = null;
  nights[MISSING] = null;
  nights[N - 1] = { bed: 23 * 60 + 5, wake: 23 * 60 + 5 + sleep[N - 1] * 60 };
  return { rhr, sleep, resp, spo2, nights };
};

const verdict = (v, lo, hi, streak = 0) =>
  v == null
    ? `<span class="t-label c3">No reading</span>`
    : v > hi
      ? `<span class="t-label c1 fresh">${ic("triangle-alert", "i-16")}Above usual${streak > 1 ? ` · day ${streak}` : ""}</span>`
      : v < lo
        ? `<span class="t-label c1 fresh">${ic("triangle-alert", "i-16")}Below usual${streak > 1 ? ` · day ${streak}` : ""}</span>`
        : `<span class="t-label c2">In your usual range</span>`;

const metric = ({ name, usual, value, unit, word, chart }) => `
  <div class="card chart">
    <div class="between"><span class="t-label c3">${name}</span><span class="t-label c3 num">usual ${usual}</span></div>
    <div class="between base"><span class="num t-num-s">${value}${unit ? `<span class="unit">${unit}</span>` : ""}</span>${word}</div>
    ${chart}
  </div>`;

const plot = (v, band, y, sel, fmt) =>
  lineChart({
    w: W, h: 112, n: N, padL: 40, xTicks, sel, crosshair: sel !== N - 1, y: { ...y, fmt },
    bands: [{ ...band, fill: "var(--color-surface3)" }],
    series: [{ v, color: T2, sw: 1.5, dots: "outside", band, r: 3, dotColor: T1, selColor: T1 }],
  });

const screen = (id, scenario, sel) => {
  const d = build(scenario);
  const notToday = sel !== N - 1;
  const rB = drift(50, 56);
  const sB = drift(6.83, 7.83);
  const pB = drift(13.6, 14.6);
  const oB = drift(95, 98, 0);
  const streak = scenario === "caution" && !notToday ? 2 : 0;
  const n = d.nights[sel];
  shell(id, {
    tab: "Wellness",
    body: `${head("Wellness", "Updated 07:40")}
    ${range(["4 weeks", "3 months", "1 year"], "4 weeks")}
    ${notToday ? `<div style="padding:0 4px">${readout(`Showing ${fmtDay(dayOf(N - 1 - sel))}`, [], { notToday: true })}</div>` : ""}
    ${metric({
      name: "Resting heart rate", usual: "50–56", value: d.rhr[sel], unit: "bpm",
      word: verdict(d.rhr[sel], 50, 56, streak),
      chart: plot(d.rhr, rB, { min: 44, max: 64, ticks: [45, 50, 55, 60] }, sel),
    })}
    ${metric({
      name: "Sleep", usual: "6:50–7:50", value: hm(d.sleep[sel]), unit: "",
      word: verdict(d.sleep[sel], 6.83, 7.83),
      chart: plot(d.sleep, sB, { min: 5, max: 9, ticks: [5, 6, 7, 8, 9] }, sel, (v) => `${v} h`),
    })}
    <div class="card chart">
      <div class="between"><span class="t-label c3">Sleep timing</span><span class="t-label c3 num">usual 22:50–23:40 to 06:20–07:05</span></div>
      <div class="between base"><span class="num t-num-s">${clock(n.bed)}–${clock(n.wake)}</span><span class="t-label c2">In your usual times</span></div>
      ${sleepTiming({ w: W, h: 168, nights: d.nights, sel, usual: { bed: [22 * 60 + 50, 23 * 60 + 40], wake: [30 * 60 + 20, 31 * 60 + 5] }, xTicks })}
    </div>
    ${metric({
      name: "Respiratory rate", usual: "13.6–14.6", value: d.resp[sel].toFixed(1), unit: "/min",
      word: verdict(d.resp[sel], 13.6, 14.6),
      chart: plot(d.resp, pB, { min: 12.5, max: 15.5, ticks: [13, 14, 15] }, sel),
    })}
    ${
      scenario === "caution"
        ? `<div class="card chart">
            <span class="t-label c3">Oxygen saturation</span>
            <span class="t-body c2">No readings in the last 4 weeks. The watch writes them during sleep; check that blood-oxygen tracking is on in OHealth.</span>
          </div>`
        : metric({
            name: "Oxygen saturation", usual: "95–98", value: d.spo2[sel], unit: "%",
            word: verdict(d.spo2[sel], 95, 98),
            chart: plot(d.spo2, oB, { min: 92, max: 100, ticks: [92, 94, 96, 98, 100] }, sel),
          })
    }`,
  });
};

screen("wellness", "ready", N - 1);
screen("wellness-selected", "caution", N - 4);

document.body.dataset.ready = "true";
</script>
</body>
</html>
