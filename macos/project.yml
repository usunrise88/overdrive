name: Overdrive
options:
  bundleIdPrefix: app.overdrive
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES

configFiles:
  Debug: Config/LocalSigning.xcconfig
  Release: Config/LocalSigning.xcconfig

targets:
  Overdrive:
    type: application
    platform: macOS
    sources:
      - path: Overdrive
        excludes:
          - "**/*.md"
    resources:
      - path: Overdrive/Resources/Fonts
        buildPhase: resources
        type: folder
      - path: Overdrive/Resources/Licenses
        buildPhase: resources
        type: folder
      - path: Overdrive/Resources/Workouts
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.overdrive.ride.macos
        PRODUCT_NAME: Overdrive
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Overdrive.entitlements
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../core/build/XCFrameworks/debug"
          - "$(SRCROOT)/../core/build/XCFrameworks/release"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "CoreBluetooth"
          - "-framework"
          - "CoreAudio"
          - "-framework"
          - "AVFoundation"
          - "-framework"
          - "Security"
          - "-framework"
          - "ApplicationServices"
    dependencies:
      - framework: ../core/build/XCFrameworks/debug/OverdriveCore.xcframework
        embed: false
        implicit: true
      - sdk: CoreBluetooth.framework
      - sdk: CoreAudio.framework
      - sdk: AVFoundation.framework
      - sdk: Security.framework
      - sdk: ApplicationServices.framework

  OverdriveTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OverdriveTests
    dependencies:
      - target: Overdrive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.overdrive.ride.macos.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Overdrive.app/Contents/MacOS/Overdrive"
        BUNDLE_LOADER: "$(TEST_HOST)"
