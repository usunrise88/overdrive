name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (contracts, server)
    runs-on: ubuntu-latest
    # The server's tests run on PGlite; with TEST_DATABASE_URL they run on a real PostgreSQL as well.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node design/tools/build-tokens.mjs --check
      - run: node design/tools/build-icons.mjs --check
      - run: node design/tools/check-contrast.mjs
      - run: pnpm check
        env:
          TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
      - run: pnpm build

  core:
    name: Kotlin core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check
        working-directory: core

  android:
    name: Android apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # assembleRelease (unsigned) catches R8 problems before a tag does.
      - run: ./gradlew check assembleDebug assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: android/app-*/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      # What failed, when a test did: the HTML and XML reports of the unit tests (they carry the failure and its output).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-reports
          path: |
            android/*/build/reports/tests/**
            android/*/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  server-image:
    name: Server image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f server/Dockerfile -t overdrive-server .
      - name: Smoke test the image
        run: |
          TOKEN="$(openssl rand -base64 36)"
          echo "::add-mask::$TOKEN"
          docker run -d --name server --network host \
            -e DATABASE_URL=postgres://postgres:ci@127.0.0.1:5432/postgres \
            -e "DEVICE_TOKENS=ci:$TOKEN" \
            overdrive-server
          up=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != 1 ]; then docker logs server; exit 1; fi

          # The ride intake end to end on the migrated database: a ride and its FIT go in once, a repeat is recognised.
          expect() {
            want="$1"; shift
            got="$(curl -sS -o /tmp/body -w '%{http_code}' "$@")"
            if [ "$got" != "$want" ]; then
              echo "expected $want, got $got: $(cat /tmp/body)"; docker logs server; exit 1
            fi
          }
          api=http://127.0.0.1:8080/v1/rides/fit-golden
          auth="authorization: Bearer $TOKEN"
          record=contracts/fixtures/rides/valid/fit-golden-3s.json
          fit=contracts/fixtures/fit/fit-golden-3s.fit
          expect 401 -X PUT "$api" -H 'content-type: application/json' --data-binary "@$record"
          expect 201 -X PUT "$api" -H "$auth" -H 'content-type: application/json' --data-binary "@$record"
          expect 200 -X PUT "$api" -H "$auth" -H 'content-type: application/json' --data-binary "@$record"
          expect 201 -X PUT "$api/fit" -H "$auth" -H 'content-type: application/vnd.ant.fit' --data-binary "@$fit"
          expect 200 -X PUT "$api/fit" -H "$auth" -H 'content-type: application/vnd.ant.fit' --data-binary "@$fit"

  macos:
    name: macOS ride app (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test Kotlin core for macosArm64
        working-directory: core
        run: ./gradlew macosArm64Test assembleOverdriveCoreDebugXCFramework
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: macos
        run: |
          cp Config/LocalSigning.xcconfig.example Config/LocalSigning.xcconfig
          xcodegen generate
      - name: Build and test macOS app (unsigned)
        run: >
          xcodebuild test
          -project macos/Overdrive.xcodeproj
          -scheme Overdrive
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
