name: Release

# Push a tag like v0.1.0 (or v0.6.0-rc.1 for a pre-release) to build signed Android APKs, the
# Apple Silicon macOS app bundle, and publish a GitHub Release. Making the release in the GitHub
# web UI works too: it creates the tag, and this run then attaches the assets and the notes to that
# release. Anything else is a dry run: everything except publishing, which also verifies the
# signing secrets. Dry runs happen when this file changes on any branch, or manually.
on:
  push:
    tags: ["v*"]
    branches: ["**", "!dependabot/**"] # Dependabot runs get no repository secrets
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify release assets, but do not publish a release
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    name: Build and sign Android APKs
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.0.0-dry.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret ANDROID_${name} is missing or empty"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1

          keystore="$RUNNER_TEMP/overdrive-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore" \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64"; exit 1; }
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

          echo "Keystore entry (the certificate fingerprint is public, compare it with the one you saved):"
          keytool -list -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" \
            || { echo "::error::Cannot open the keystore: wrong password, or no entry with alias ANDROID_KEY_ALIAS"; exit 1; }

      - name: Build signed release APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew check assembleRelease
          -PoverdriveVersionName="${VERSION#v}"
          -PoverdriveVersionCode="${{ github.run_number }}"

      - name: Verify signatures and collect Android assets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          expected="$(keytool -list -keystore "$ANDROID_KEYSTORE_FILE" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" \
            | sed -n 's/^Certificate fingerprint (SHA-256): //p' | tr -d ':' | tr 'A-F' 'a-f')"

          mkdir -p dist-android
          for app in ride companion; do
            apk="android/app-$app/build/outputs/apk/release/app-$app-release.apk"
            "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs-$app.txt"
            # The label differs between apksigner versions ("Signer #1 ..." / "V2 Signer: ..."), the digest does not.
            actual="$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs-$app.txt" | sed 's/.*: //')"
            [ -n "$actual" ] || { echo "::error::Could not read the signer digest of the $app APK"; exit 1; }
            [ "$actual" = "$expected" ] || { echo "::error::$app APK is not signed with the release key"; exit 1; }
            cp "$apk" "dist-android/overdrive-$app-${VERSION#v}.apk"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist-android-${{ env.VERSION }}
          path: dist-android/*
          if-no-files-found: error
          retention-days: 1

  macos:
    name: Build macOS ride app (Apple Silicon)
    runs-on: macos-15
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.0.0-dry.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test Kotlin core Release XCFramework for macosArm64
        working-directory: core
        run: |
          ./gradlew macosArm64Test assembleOverdriveCoreReleaseXCFramework
          rm -rf build/XCFrameworks/debug
          mkdir -p build/XCFrameworks/debug
          cp -R build/XCFrameworks/release/OverdriveCore.xcframework build/XCFrameworks/debug/OverdriveCore.xcframework

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: macos
        run: |
          cp Config/LocalSigning.xcconfig.example Config/LocalSigning.xcconfig
          xcodegen generate

      - name: Run macOS unit tests
        run: >
          xcodebuild test
          -project macos/Overdrive.xcodeproj
          -scheme Overdrive
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGN_IDENTITY="-"
          DEVELOPMENT_TEAM=""
          ENABLE_HARDENED_RUNTIME=NO

      - name: Build Release Overdrive.app (Apple Silicon, ad-hoc signed)
        run: >
          xcodebuild build
          -project macos/Overdrive.xcodeproj
          -scheme Overdrive
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath macos/build
          MARKETING_VERSION="${VERSION#v}"
          CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          CODE_SIGN_IDENTITY="-"
          DEVELOPMENT_TEAM=""
          ENABLE_HARDENED_RUNTIME=NO

      - name: Verify and archive Overdrive.app
        run: |
          app="macos/build/Build/Products/Release/Overdrive.app"
          test -d "$app"
          lipo -archs "$app/Contents/MacOS/Overdrive" | grep -qx 'arm64'
          codesign --verify --deep --strict "$app"
          mkdir -p dist-macos
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist-macos/overdrive-macos-arm64-${VERSION#v}.zip"
          ls -lh dist-macos/

      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos-${{ env.VERSION }}
          path: dist-macos/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Collect checksums and publish
    needs: [android, macos]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.0.0-dry.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: dist-android-${{ env.VERSION }}
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: dist-macos-${{ env.VERSION }}
          path: dist

      - name: Generate SHA256SUMS
        run: |
          (cd dist && sha256sum overdrive-*.apk overdrive-*.zip > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: overdrive-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

      - name: Publish the GitHub Release
        # Tag pushes publish; a manual run publishes only from a tag with dry_run turned off.
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.dry_run == false)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$VERSION" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          args=(--title "Overdrive ${VERSION#v}")
          # Hand-written notes live in docs/releases/<tag>.md (see docs/releasing.md); otherwise generate them.
          notes="docs/releases/${VERSION}.md"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            # The release was made in the GitHub web UI (which also created the tag): attach the files and
            # set the title, notes and pre-release flag the same way a tag push would have.
            echo "Release $VERSION already exists: attaching the files to it."
            gh release upload "$VERSION" dist/* --clobber
            if [ -f "$notes" ]; then args+=(--notes-file "$notes"); fi
            gh release edit "$VERSION" "${args[@]}" --prerelease="$prerelease"
          else
            if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
            if [ "$prerelease" = true ]; then args+=(--prerelease); fi
            gh release create "$VERSION" dist/* "${args[@]}"
          fi
