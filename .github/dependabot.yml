# Gradle is not listed: both Gradle builds share gradle/libs.versions.toml, which sits outside either
# build's directory. Bump it by hand (or with Renovate) and run `make check android-check`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Types must match the Node runtime (24 LTS); bump them together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node LTS line; move by hand when the next LTS is current.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
